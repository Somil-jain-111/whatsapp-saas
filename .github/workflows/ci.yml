name: CI

on:
  pull_request:
  push:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm run lint:check
      - run: npm test -- --runInBand --testPathIgnorePatterns=phase-one-database.spec.ts
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run ui:lint
      - run: npm run ui:test
      - run: npm run ui:build
      - run: docker build -t whatsapp-saas:${{ github.sha }} .
